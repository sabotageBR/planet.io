<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>planet.io</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #030507; overflow: hidden; }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    fetch('./game.js')
      .then(r => r.text())
      .then(src => {
        // Remove the React import (provided as UMD globals)
        src = src.replace(/^import\s*\{[^}]+\}\s*from\s*['"]react['"]\s*;?\s*\n?/m, '');
        // Remove export default so PlanetIO becomes a plain function declaration
        src = src.replace(/^export default /m, '');
        // Transform JSX
        const { code } = Babel.transform(src, { presets: ['react'] });
        // Execute with React globals in scope and mount
        const script = document.createElement('script');
        script.textContent = `(function(){
          const { useState, useEffect, useRef, useCallback } = React;
          ${code}
          ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(PlanetIO));
        })();`;
        document.body.appendChild(script);
      })
      .catch(err => {
        document.getElementById('root').innerHTML =
          '<div style="color:#ff4444;padding:40px;font-family:monospace">Failed to load game: ' + err.message + '</div>';
      });
  </script>
</body>
</html>
