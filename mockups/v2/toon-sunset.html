<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>planet.io v2 — modelo: Cartoon Crepúsculo</title>
<style>
/* ── BASE v2 ── só estrutura/layout. Toda a aparência (cores, fontes, bordas,
   sombras, posições finais do HUD) vem do CSS do tema, que pode sobrescrever
   qualquer regra daqui. Variáveis --bg, --accent… vêm de THEME.tokens. ───── */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#000;font-family:var(--font-ui,system-ui,sans-serif);color:var(--text,#fff)}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg,#000)}
canvas#game{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
.hidden{display:none!important}
button{cursor:pointer;font:inherit;color:inherit;background:none;border:0}
button:disabled{cursor:default;opacity:.45}
input,select{font:inherit;color:inherit}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:6px 8px}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
.mono,.code{font-family:var(--font-mono,monospace)}
.dim{opacity:.6}
.reg{font-style:normal}

/* aparelho móvel: o #app vira um "telefone" centralizado e escalado para caber */
body[data-mode="portrait"] #app,body[data-mode="landscape"] #app{inset:auto;left:50%;top:50%;
  transform:translate(-50%,-50%) scale(var(--fit,1));transform-origin:center;border-radius:28px;
  box-shadow:0 0 0 10px #111,0 0 0 12px #333,0 30px 80px rgba(0,0,0,.7)}
body[data-mode="portrait"] #app{width:390px;height:844px}
body[data-mode="landscape"] #app{width:844px;height:390px}
body[data-frame="0"] #app{border-radius:0!important;box-shadow:none!important}

/* ── HUD in-game (posições padrão; tema reposiciona) ── */
#hud>*{position:absolute;z-index:5}
#hud-top{top:12px;left:12px;display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip i{font-style:normal}
#hud-lb{top:12px;right:12px;min-width:200px}
.ph{margin-bottom:6px}
.lb-row{display:flex;align-items:center;gap:8px;padding:2px 0;position:relative}
.lb-pos{flex:none;min-width:1.4em;text-align:right}
.lb-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lb-val{flex:none;font-variant-numeric:tabular-nums}
#hud-score{bottom:12px;left:12px;min-width:170px}
.score-big{line-height:1}
.score-row{display:flex;gap:6px;align-items:baseline}
#hud-status{bottom:12px;left:200px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#hud-pw{display:flex;gap:6px;flex-wrap:wrap}
.pw{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.pw i{font-style:normal}
#hud-cd{bottom:180px;right:12px;display:flex;gap:8px}
.cd{position:relative;width:88px;height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;--p:1}
.cd .cd-fill{position:absolute;left:0;bottom:0;height:100%;width:calc(var(--p)*100%);z-index:-1}
.cd span,.cd em{position:relative;font-style:normal;line-height:1.1}
#touch{display:none;bottom:24px;right:16px;gap:12px;align-items:flex-end}
body[data-mode="portrait"] #touch,body[data-mode="landscape"] #touch{display:flex}
.tbtn{width:64px;height:64px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;user-select:none;-webkit-user-select:none}
.tbtn span{font-size:10px;letter-spacing:1px}
.tbtn b{font-size:12px}
.tbtn.cd{opacity:.45}
#toast{position:absolute;left:50%;bottom:90px;transform:translate(-50%,10px);z-index:30;opacity:0;transition:.25s;pointer-events:none;padding:8px 16px}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ── telas ── */
.screen{position:absolute;inset:0;z-index:10;display:none;overflow:auto;padding:24px;
  -webkit-overflow-scrolling:touch}
.screen.on{display:flex;align-items:flex-start;justify-content:center}
#s-entry.on,#s-dead.on{align-items:center}
.wrap{width:min(1100px,100%);display:grid;gap:14px;align-content:start}
.card{min-width:0}
.ph{white-space:nowrap}
.field{width:100%;display:flex;flex-direction:column;gap:5px}
.field input{width:100%}
.coinbar{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.hint{line-height:1.4}
.nav{display:flex;gap:6px;flex-wrap:wrap;grid-area:nav}
.nav-btn{display:inline-flex;align-items:center;gap:6px}
.nav-ico{display:none}
.sh{display:flex;align-items:center;gap:14px;grid-area:head}
.stitle{flex:1;font-weight:inherit}
.seg{display:inline-flex}
.toggles{display:flex;gap:12px;flex-wrap:wrap;grid-area:toggles}

/* entrada */
.entry-wrap{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);grid-template-areas:"brand brand" "main side";width:min(860px,100%)}
.brand-block{grid-area:brand;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.brand{white-space:nowrap}
.entry-main{grid-area:main;display:flex;flex-direction:column;align-items:center;gap:12px}
.entry-side{grid-area:side;display:flex;flex-direction:column;gap:8px}
.skinrow{width:100%;display:flex;align-items:center;gap:12px}
.skinrow canvas{width:56px;height:56px;flex:none}
.skinmeta{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.btn-primary,.btn-secondary{width:100%}
.entry-links{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%}
.entry-links .btn-secondary{width:auto;padding-left:6px;padding-right:6px}
.guest-note{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.mini-rank,.mini-rooms{display:flex;flex-direction:column;gap:3px}
.mr-row{display:flex;gap:8px;align-items:baseline}
.mr-pos{min-width:1.3em;text-align:right}
.mr-nick{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr-val{font-variant-numeric:tabular-nums}

/* salas */
.lobby-wrap{grid-template-columns:minmax(0,1fr) 260px;grid-template-areas:"nav nav" "head head" "hero side" "list side"}
.lobby-hero{grid-area:hero;display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:center;grid-template-areas:"me play" "me note" "code code"}
.me-chip{grid-area:me;display:flex;align-items:center;gap:10px}
.me-chip canvas{width:56px;height:56px}
.me-chip div{display:flex;flex-direction:column}
.lobby-hero .btn-primary{grid-area:play}
.lobby-hero .hint{grid-area:note}
.code-row{grid-area:code;display:flex;gap:8px}
.code-row input{flex:1.2;min-width:0;text-transform:uppercase}
.code-row .btn-secondary,.code-row .btn-primary{width:auto;flex:1}
.room-list{grid-area:list;display:flex;flex-direction:column}
.room-row{display:grid;grid-template-columns:70px 60px 1fr 60px 60px 90px;gap:8px;align-items:center;padding:6px 4px}
.room-row .pl{display:flex;align-items:center;gap:8px}
.room-row .bar{display:inline-block;width:70px;height:6px;position:relative;overflow:hidden}
.room-row .bar::after{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--p)*100%);background:currentColor}
.room-row .act{text-align:right}
.lobby-side{grid-area:side}

/* ranking */
.rank-wrap{grid-template-areas:"nav" "head" "toggles" "table" "me"}
.rank-table{grid-area:table;overflow:auto;max-height:60vh}
.rank-me{grid-area:me;display:flex;gap:12px;align-items:baseline}
th.c-rank,td.c-rank{width:3em;text-align:right}

/* perfil */
.profile-wrap{grid-template-columns:1fr 1fr;grid-template-areas:"nav nav" "head head" "phead phead" "stats stats" "hist ach"}
.profile-head{grid-area:phead;display:flex;align-items:center;gap:16px}
.profile-head canvas{width:72px;height:72px;flex:none}
.pf-meta{flex:1;display:flex;flex-direction:column;gap:4px}
.profile-head .btn-secondary{width:auto}
.stat-cards{grid-area:stats;display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.pf-hist{grid-area:hist;overflow:auto}
.pf-ach{grid-area:ach}
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ach{display:flex;gap:10px;align-items:center}
.ach-ico{font-size:22px;flex:none}
.ach-body{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.ach-body i{font-style:normal}
.ach-bar{display:block;height:4px;position:relative;overflow:hidden}
.ach-bar i{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p)*100%);background:currentColor}

/* loja */
.shop-wrap{grid-template-areas:"nav" "head" "eq" "filters" "grid" "note"}
.shop-eq{grid-area:eq;display:flex;align-items:center;gap:14px}
.shop-eq canvas{width:64px;height:64px;flex:none}
.filters{grid-area:filters;display:flex;gap:6px;flex-wrap:wrap}
.shop-grid{grid-area:grid;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;align-content:start;max-height:56vh;overflow:auto;padding:4px}
.skin-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 8px;text-align:center;cursor:pointer}
.skin-card canvas{width:60px;height:60px}
.skin-card.locked,.skin-card.secret,.skin-card.poor{cursor:default}
.badge{position:absolute;top:5px;right:5px}
.shop-note{grid-area:note;text-align:center}

/* preferências */
.prefs-wrap{grid-template-areas:"nav" "head" "groups" "foot";width:min(760px,100%)}
.prefs-groups{grid-area:groups;display:grid;gap:12px}
.pg h2{margin-bottom:8px}
.pref-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0}
.toggle{width:44px;height:24px;border-radius:12px;position:relative;flex:none}
.toggle i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:currentColor;transition:.15s}
.toggle[aria-checked="true"] i{left:23px}
.range{display:inline-flex;align-items:center;gap:8px}
.range b{min-width:2.2em;text-align:right}
.prefs-foot{grid-area:foot;display:flex;gap:10px;justify-content:flex-end}
.prefs-foot button{width:auto}

/* morte */
.dead-card{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(440px,92vw)}
.dead-stats{display:flex;gap:22px}
.dead-stats div{display:flex;flex-direction:column;align-items:center;gap:2px}
.dead-by,.dead-rank{display:flex;flex-direction:column;align-items:center;gap:2px}
.dead-actions{display:flex;flex-direction:column;gap:8px;width:100%}

/* overlays (conta, reconectando) */
.overlay{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.on{display:flex}
.modal{width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
.tabs{display:flex}
.tab{display:none;flex-direction:column;gap:10px}
.tab.on{display:flex}
.modal-actions{display:flex;gap:8px}
.reconn{align-items:center;text-align:center}
.spinner{width:44px;height:44px;border-radius:50%;border:3px solid currentColor;border-top-color:transparent;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body[data-reduce="1"] *{animation-duration:0s!important;transition-duration:0s!important}
body[data-bigtext="1"]{font-size:118%}

/* ── mobile (dentro do aparelho): uma coluna, HUD compacto ── */
body[data-mode="portrait"] .screen,body[data-mode="landscape"] .screen{padding:14px}
body[data-mode="portrait"] .wrap,body[data-mode="landscape"] .wrap{grid-template-columns:1fr!important;grid-template-areas:none!important}
body[data-mode="portrait"] .wrap>*,body[data-mode="landscape"] .wrap>*{grid-area:auto!important}
body[data-mode="portrait"] .entry-links{grid-template-columns:repeat(3,1fr)}
body[data-mode="portrait"] .stat-cards{grid-template-columns:repeat(3,1fr)}
body[data-mode="portrait"] .ach-grid{grid-template-columns:1fr}
body[data-mode="portrait"] .room-row{grid-template-columns:64px 1fr 50px 70px}
body[data-mode="portrait"] .room-row .shard,body[data-mode="portrait"] .room-row .bots{display:none}
body[data-mode="portrait"] .shop-grid{grid-template-columns:repeat(3,1fr);max-height:none}
body[data-mode="portrait"] .rank-table{max-height:none}
body[data-mode="portrait"] .entry-side,body[data-mode="portrait"] .lobby-side{display:none}
body[data-mode="portrait"] #hud-lb .lb-row:nth-child(n+4){display:none}
body[data-mode="portrait"] #hud-cd,body[data-mode="landscape"] #hud-cd{display:none}
body[data-mode="portrait"] #hud-status{left:12px;bottom:96px}
body[data-mode="landscape"] .entry-side,body[data-mode="landscape"] .lobby-side{display:none}
body[data-mode="landscape"] #hud-lb .lb-row:nth-child(n+5){display:none}
body[data-mode="landscape"] #hud-status{left:12px;bottom:80px}

/* ── barra de desenvolvimento (fora do #app) ── */
#devbar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:3px;
  padding:5px 8px;white-space:nowrap;font:12px system-ui,sans-serif;color:#9fb0c8;background:rgba(8,10,16,.88);
  border:1px solid rgba(255,255,255,.16);border-radius:999px;backdrop-filter:blur(8px);max-width:98vw;overflow-x:auto}
#devbar button,#devbar a{color:#9fb0c8;text-decoration:none;padding:4px 8px;border-radius:999px;font:inherit;line-height:1}
#devbar button:hover,#devbar a:hover{background:rgba(255,255,255,.1);color:#fff}
#devbar button.on{background:#fff;color:#111;font-weight:700}
#devbar .db-model{color:#fff;padding:0 4px}
#devbar .db-arrow{color:#ffcc66}
#devbar .db-sep{width:1px;height:16px;background:rgba(255,255,255,.18);margin:0 4px}
#devbar .db-key{color:#5a6b80;padding-left:6px;font-size:11px}
</style>
<style id="theme-css"></style>
</head>

  // ── simulação ───────────────────────────────────────────────────────────────
  const G=3920;                                                       // buraco negro: a = G/max(d,rc)²
  function botThink(b){
    b._t--;
    if(b._t<=0){b._t=25+R()*45;
      const c=b.pieces[0],mass=b.pieces.reduce((s,p)=>s+p.r*p.r,0);
      let threat=null,prey=null,td=1e9,pd=1e9;
      Object.values(g.players).forEach(o=>{if(o===b||o.dead||!o.pieces.length)return;
        const om=o.pieces.reduce((s,p)=>s+p.r*p.r,0),d=dist(c,o.pieces[0]);
        if(om>mass*1.25&&d<620&&d<td){td=d;threat=o;}
        else if(mass>om*1.3&&d<760&&d<pd){pd=d;prey=o;}});
      if(threat){b._st="flee";b._flee=threat.id;}
      else if(prey){b._st="hunt";b._hunt=prey.id;}
      else{b._st="wander";b._tx=rnd(150,WW-150);b._ty=rnd(150,WH-150);}}
    const c=b.pieces[0];
    if(b._st==="flee"){const o=g.players[b._flee];
      if(o&&!o.dead&&o.pieces.length){b._tx=c.x*2-o.pieces[0].x;b._ty=c.y*2-o.pieces[0].y;
        if(b._missiles&&R()<.012)fire(b);}else b._st="wander";}
    else if(b._st==="hunt"){const o=g.players[b._hunt];
      if(o&&!o.dead&&o.pieces.length){b._tx=o.pieces[0].x;b._ty=o.pieces[0].y;
        if(b._missiles&&R()<.01)fire(b);
        if(dist(c,o.pieces[0])<c.r*3.2&&c.r>o.pieces[0].r*1.5&&R()<.05)botSplit(b);}else b._st="wander";}
    else{let bf=null,bd=1e9;g.food.forEach(f=>{const d=dist(c,f);if(d<420&&d<bd){bd=d;bf=f;}});
      if(bf){b._tx=bf.x;b._ty=bf.y;}}
    for(const h of g.holes){const d=dist(c,h);if(h.k>.3&&d<h.ri*1.3){b._tx=c.x+(c.x-h.x)*3;b._ty=c.y+(c.y-h.y)*3;}}   // evita buracos negros
    b._tx=clamp(b._tx,40,WW-40);b._ty=clamp(b._ty,40,WH-40);
  }
  function botSplit(b){if(b.pieces.length>=4)return;const np=[];
    b.pieces.forEach(p=>{if(b.pieces.length+np.length>=4||p.r<30){np.push(p);return;}
      const nr=p.r/Math.SQRT2,a=Math.atan2(b._ty-p.y,b._tx-p.x);
      p.r=nr;p.mergeTimer=mergeTime(nr);
      const q=mkPiece(p.x,p.y,nr,Math.cos(a)*SPLIT_SPEED,Math.sin(a)*SPLIT_SPEED);

    b.pieces=np;}
  // impulso elástico entre dois círculos com massa r² (correção posicional + restituição e)
  function bounce(A,B,e,fxKind){const dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy);if(d<1e-4)return false;
    const nx=dx/d,ny=dy/d,ma=A.r*A.r,mb=B.r*B.r,ia=1/ma,ib=1/mb,im=ia+ib,pen=A.r+B.r-d;
    A.x-=nx*pen*.3*ia/im;A.y-=ny*pen*.3*ia/im;B.x+=nx*pen*.3*ib/im;B.y+=ny*pen*.3*ib/im;
    const vn=(B.vx-A.vx)*nx+(B.vy-A.vy)*ny;if(vn>0)return false;
    const j=-(1+e)*vn/im;A.vx-=j*nx*ia;A.vy-=j*ny*ia;B.vx+=j*nx*ib;B.vy+=j*ny*ib;
    if(fxKind&&-vn>1.6&&g.fx.length<32)g.fx.push({t:fxKind,x:A.x+nx*A.r,y:A.y+ny*A.r,r:Math.min(A.r,B.r),age:0,ttl:14,nx,ny,power:Math.min(1,-vn/8)});
    return true;}
  function pop(p,pc,a){const n=Math.min(clamp(Math.floor(pc.r/22),2,6),MAX_PIECES-p.pieces.length);if(n<1)return false;

    for(let i=0;i<n;i++){const an=rnd(0,6.28);const q=mkPiece(pc.x,pc.y,nr,Math.cos(an)*SPLIT_SPEED*.8,Math.sin(an)*SPLIT_SPEED*.8);
      q.mergeTimer=mergeTime(nr);q.splitting=true;q.splitT=0;p.pieces.push(q);}
    g.fx.push({t:"pop",x:a.x,y:a.y,r:a.r,age:0,ttl:22,color:p.color});respawnAst(a);
    if(TH.onPop)TH.onPop(g,pc,a);return true;}
  function chip(p,pc,a,nx,ny){pc.r=Math.max(16,pc.r*Math.sqrt(.96));const n=1+(R()<.5?1:0);
    for(let i=0;i<n;i++){const an=Math.atan2(-ny,-nx)+rnd(-.6,.6);

    g.fx.push({t:"chip",x:pc.x+nx*pc.r,y:pc.y+ny*pc.r,r:pc.r*.4,age:0,ttl:12,nx,ny,color:p.color});}

  function tick(){
    g.time+=16;g.tick++;
    const plist=Object.values(g.players).filter(p=>!p.dead);
    const me=g.players[g.me];
    if(me&&!me.dead&&g.screen==="game"&&!g.reconn){const t=worldMouse();me._tx=t.x;me._ty=t.y;}
    plist.forEach(p=>{if(p.isBot)botThink(p);});

    // movimento com inércia: acelera até vmax; acima de vmax (arremesso) só o arrasto freia
    plist.forEach(p=>{p.pieces.forEach(pc=>{
      const dx=p._tx-pc.x,dy=p._ty-pc.y,len=Math.hypot(dx,dy)||1;
      const vmax=clamp(220/pc.r,.8,6)*(p._powerups.speed>0?1.85:1);
      const sp=Math.hypot(pc.vx,pc.vy),launch=sp>vmax*1.05;
      if(len>4&&!(p.id===g.me&&g.reconn)){const k=vmax*ACC*(launch?1.5:1);pc.vx+=(dx/len)*k;pc.vy+=(dy/len)*k;}
      const f=launch?LAUNCH_FRICTION:FRICTION;pc.vx*=f;pc.vy*=f;
      if(!launch){const s2=Math.hypot(pc.vx,pc.vy);if(s2>vmax){pc.vx*=vmax/s2;pc.vy*=vmax/s2;}}

      g.cam.x=me.pieces[0].x;g.cam.y=me.pieces[0].y;g.cam.scale=.9;for(let i=0;i<40;i++){tick();}g.paused=true;refreshHud();}}
    setTimeout(()=>{g.paused=true;g.stopped=true;draw();window.__ready=true;document.title="READY";
      if(Q.has("rects"))document.title="RECTS "+JSON.stringify(Array.from(document.querySelectorAll(Q.get("rects")||"#touch,#touch .tbtn,#hud-status,#hud-score,#app")).map(e=>{const r=e.getBoundingClientRect();return[(e.id||e.className),Math.round(r.left),Math.round(r.top),Math.round(r.width),Math.round(r.height)];}));},1500);}

  // ── ?selftest: percorre telas × modos e reporta no título ───────────────────
  if(Q.has("selftest")){const errs=[];const orig=console.error;
    window.addEventListener("error",e=>errs.push(String(e.message)));
    try{["desktop","portrait","landscape"].forEach(m=>{setMode(m);sizeCanvas();
      SCREENS.forEach(([s])=>{gotoScreen(s);for(let i=0;i<20;i++){tick();}draw();});
      gotoScreen("game");doSplit();doEject();fire(g.players.me);for(let i=0;i<60;i++){tick();}draw();setReconn(false);setAccount(false);});
      renderShop();shopF="legendary";renderShop();shopF="all";rkP="week";rkM="kills";renderRank();renderProfile();renderPrefs();
      const miss=["id","name","tokens","css","drawBg","drawWorld","drawFood","drawEjected","drawMissile","drawCell","drawAsteroid","drawBlackHole","drawHud"].filter(k=>!(k in TH));
      if(miss.length)errs.push("tema sem: "+miss.join(","));
      const tkm=["bg","surface","text","muted","accent","accent2","danger","ok","line","radius","radiusLg","space","fontUi","fontMono","shadow"].filter(k=>!(k in (TH.tokens||{})));
      if(tkm.length)errs.push("tokens sem: "+tkm.join(","));}
    catch(e){errs.push(String(e&&e.stack||e));}
    setMode("desktop");
    setTimeout(()=>{document.title=errs.length?"SELFTEST FAIL: "+errs.join(" | "):"SELFTEST OK";},300);}

  // ── ?bench: pior caso ───────────────────────────────────────────────────────
  if(Q.has("bench")){
    const sb=document.createElement("div");sb.id="statbox";
    sb.style.cssText="position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:99;font:12px monospace;"+
      "color:#7CFC00;background:rgba(0,0,0,.75);padding:5px 12px;border-radius:6px;pointer-events:none;max-width:96vw;white-space:pre-wrap";
    document.body.appendChild(sb);
    const heavy=()=>{
      while(g.food.length<400)g.food.push(mkFood());
      const me=g.players.me;if(!me)return;
      const cx=me.pieces[0].x,cy=me.pieces[0].y;
      me.pieces=[];for(let i=0;i<8;i++){const a=i/8*6.283;const q=mkPiece(cx+Math.cos(a)*190,cy+Math.sin(a)*190,62);q.vx=Math.cos(a)*2;q.vy=Math.sin(a)*2;
        for(let k=0;k<12;k++)q.trail.push({x:q.x-Math.cos(a)*k*4,y:q.y-Math.sin(a)*k*4});me.pieces.push(q);}
      me.pieces.forEach(pc=>pc.mergeTimer=9999);me._powerups={speed:500,magnet:500,shield:500};
      Object.values(g.players).forEach(b=>{if(!b.isBot)return;
        const r=Math.max(26,b.pieces[0].r/2),bx=cx+rnd(-500,500),by=cy+rnd(-400,400);
        b.pieces=[];for(let i=0;i<4;i++){const a=i/4*6.283;const q=mkPiece(bx+Math.cos(a)*r*2,by+Math.sin(a)*r*2,r);q.vx=Math.cos(a)*1.5;q.vy=Math.sin(a)*1.5;
          for(let k=0;k<12;k++)q.trail.push({x:q.x-k*3,y:q.y});b.pieces.push(q);}
        b.pieces.forEach(pc=>pc.mergeTimer=9999);});
      g.asteroids.forEach((a,i)=>{a.x=cx+Math.cos(i)*(250+i*20);a.y=cy+Math.sin(i*1.7)*300;});
      g.holes.forEach((h,i)=>{h.x=cx+(i-1)*420;h.y=cy+240;h.phase="active";h.k=1;h.t=5;});
      for(let i=0;i<8;i++)g.fx.push({t:["bounce","pop","eat","suck","merge","chip","boom","split"][i],x:cx+rnd(-300,300),y:cy+rnd(-200,200),r:40,age:2,ttl:9999,nx:1,ny:0,power:1,color:"#fff"});
      if(g.missiles.length<6)Object.values(g.players).slice(0,6).forEach(p=>{p._missiles=3;fire(p);});};
    const measure=(fn,n)=>{const t0=performance.now();for(let i=0;i<n;i++)fn();try{octx.getImageData(0,0,1,1);}catch(e){}return(performance.now()-t0)/n;};
    const runBench=()=>{sizeCanvas();g.paused=true;g.cam.scale=.5;const out=[];
      document.body.setAttribute("data-cull","0");for(let i=0;i<40;i++){draw();}   // aquece: assa todos os sprites visíveis antes de medir
      [false,true].forEach(cullOn=>{document.body.setAttribute("data-cull",cullOn?"1":"0");
        for(let i=0;i<12;i++){draw();}
        const dms=measure(draw,60),tms=measure(tick,40);
        const bg=measure(()=>TH.drawBg(octx,g.W,g.H,g.cam,g.time,g),30);
        const world=(fn)=>()=>{octx.save();octx.translate(g.W/2,g.H/2);octx.scale(g.cam.scale,g.cam.scale);octx.translate(-g.cam.x,-g.cam.y);fn();octx.restore();};
        const wl=measure(world(()=>TH.drawWorld(octx,g.cam,g.time,g,g.W,g.H)),30);
        const ast=measure(world(()=>g.asteroids.forEach(a=>TH.drawAsteroid(octx,a,g.time,g))),30);
        const bh=measure(world(()=>g.holes.forEach(h=>TH.drawBlackHole(octx,h,g.time,g))),30);
        const tr=TH.drawTrail?measure(world(()=>Object.values(g.players).forEach(p=>p.pieces.forEach(pc=>TH.drawTrail(octx,pc,p,p.id===g.me,g.time,g)))),30):0;
        const fx=TH.drawFx?measure(world(()=>g.fx.forEach(f=>TH.drawFx(octx,f,g.time,g))),30):0;
        const post=TH.drawPost?measure(()=>TH.drawPost(octx,g.W,g.H,g.time,g),30):0;
        out.push((cullOn?"culling ON":"culling OFF")+": desenho "+dms.toFixed(2)+"ms + lógica "+tms.toFixed(2)+"ms = "+(dms+tms).toFixed(2)+"ms/quadro ("+g.drawn+" objs; fundo "+bg.toFixed(2)+", mundo "+wl.toFixed(2)+", asteroides "+ast.toFixed(2)+", buracos "+bh.toFixed(2)+", rastros "+tr.toFixed(2)+", fx "+fx.toFixed(2)+", pós "+post.toFixed(2)+")");});
      document.body.setAttribute("data-cull","1");
      const txt=TH.id+" | "+g.W+"x"+g.H+" | "+out.reverse().join(" | ");sb.textContent=txt;document.title="BENCH "+txt;g.benchDone=true;g.paused=false;
      try{fetch("/__bench?"+encodeURIComponent(txt)).catch(()=>{});}catch(e){}   // servido por http: o log do servidor guarda o resultado
    };
    const leve=Q.has("leve");
    setTimeout(()=>{startGame();if(!leve)heavy();setTimeout(runBench,900);},150);
  }

  requestAnimationFrame(frame);
}

window.MOCK={boot,u:U};
})();

<script>
// ── VARIAÇÃO 4 — CARTOON CREPÚSCULO ──────────────────────────────────────────
// Mesmo DNA do Cartoon Cósmico (tinta grossa, cores chapadas, sombras sólidas,
// botões que afundam, mundo sempre visível) num fim de tarde quente: céu em
// degradê laranja → magenta → roxo com um sol baixo cortado pela borda, faixas
// de nuvem chapadas, estrelas só na parte roxa e cenário em SILHUETA com fio
// quente ("Gravity Falls no espaço"). TORÇÃO ESTRUTURAL: no desktop/paisagem os
// menus são uma GAVETA que entra pela direita (altura inteira, abas fixas no
// rodapé da gaveta, fileiras ancoradas acima delas) e o mundo continua visível à
// esquerda; no retrato voltam a ser folhas que sobem. HUD reorganizado: placar
// dourado em cima à esquerda, pódio de balões embaixo à esquerda, radar quente

// Desempenho: tudo que tem contorno/volume é sprite assado por (skin, tier);
// efeitos são arcs/lines + um texto; fundo (céu, sol, nuvens) em cache por resolução.
(function(){
const u=MOCK.u,WW=u.WW,WH=u.WH,sh=u.sh,rgba=u.rgba;
const INK="#241238",CREAM="#fff1d6",GOLD="#ffb547",CORAL="#ff5e6c",TEAL="#2ec4b6",PEACH="#ffcf9a",PLUM="#3b1f6b",MAG="#e0417f",ORA="#ff8a3d",SIL="#2a1550";
const FONT="'Trebuchet MS',Verdana,sans-serif",T=900;
let L=[],BIG=null,PROPS=[],bg=null,bgW=0,bgH=0;

// ── sprites (prefixo "ts": o cache de sprites é global por página) ────────────
const PK=sk=>sk.ring?2.05:1.3;
function planetSpr(sk,isMe,size){return u.sprite("tsp"+sk.id+(isMe?"m":"")+size,size,(c,R)=>{
  const K=PK(sk),r=R/K,col=sk.color,lw=Math.max(2.5,r*.1);c.lineJoin="round";c.lineCap="round";
  const band=(a0,a1)=>{c.beginPath();c.ellipse(0,0,r*1.85,r*.56,0,a0,a1,false);c.ellipse(0,0,r*1.3,r*.39,0,a1,a0,true);c.closePath();c.fill();c.stroke();};
  if(sk.ring){c.fillStyle=sh(col,.3);c.strokeStyle=INK;c.lineWidth=lw*.7;band(Math.PI,Math.PI*2);}
  c.fillStyle=col;c.beginPath();c.arc(0,0,r,0,6.283);c.fill();
  c.save();c.beginPath();c.arc(0,0,r,0,6.283);c.clip();
  c.fillStyle="rgba(59,31,107,.45)";c.beginPath();c.arc(r*.42,r*.44,r*1.05,0,6.283);c.fill();            // crescente roxo (lado oposto ao sol)
  c.strokeStyle="rgba(255,207,154,.8)";c.lineWidth=r*.16;c.beginPath();c.arc(0,0,r*.9,-2.95,-.95);c.stroke(); // fio quente do lado do sol
  c.fillStyle="rgba(255,241,214,.42)";c.beginPath();c.ellipse(-r*.36,-r*.38,r*.34,r*.2,-.75,0,6.283);c.fill();
  c.fillStyle="rgba(255,255,255,.3)";c.beginPath();c.arc(-r*.08,-r*.58,r*.08,0,6.283);c.fill();
  c.globalAlpha=.16;c.font=`${r*1.3}px serif`;c.textAlign="center";c.textBaseline="middle";c.fillText(sk.emoji,r*.05,r*.15);c.globalAlpha=1;
  c.restore();
  if(sk.ring){c.fillStyle=sh(col,.3);c.strokeStyle=INK;c.lineWidth=lw*.7;band(0,Math.PI);}
  c.strokeStyle=isMe?CREAM:INK;c.lineWidth=lw;c.beginPath();c.arc(0,0,r,0,6.283);c.stroke();
  if(isMe){c.strokeStyle=INK;c.lineWidth=lw*.55;c.beginPath();c.arc(0,0,r+lw*.78,0,6.283);c.stroke();}});}

// comida em 12 matizes quentes (indexados por f.hue, 0–11) — mantém o cache pequeno
const WARM=["#ffb547","#ff8a3d","#ff5e6c","#ff7ab3","#ffcf9a","#ffd96b","#ff9e57","#e0417f","#ffc0a0","#f4a261","#ff6f91","#ffe1a8"];
const FK=2.1,FICON={missile_ammo:"🚀",powerup_speed:"⚡",powerup_magnet:"🧲",powerup_shield:"🛡️"};
const foodCol=f=>FICON[f.type]?f.color:WARM[(f.hue|0)%12];
function foodSpr(f){const col=foodCol(f);return u.sprite("tsf"+f.type+col,64,(c,R)=>{const r=R/FK;c.lineJoin="round";c.strokeStyle=INK;c.lineWidth=Math.max(2,r*.24);c.fillStyle=col;
  const gl=(x,y,k)=>{c.fillStyle="rgba(255,255,255,.55)";c.beginPath();c.arc(x,y,r*k,0,6.283);c.fill();};
  if(FICON[f.type]){c.beginPath();c.arc(0,0,r*1.5,0,6.283);c.fill();c.stroke();c.font=`${r*1.5}px serif`;c.textAlign="center";c.textBaseline="middle";c.fillText(FICON[f.type],0,r*.1);return;}
  if(f.type==="star"){u.spikes(c,r*1.6,5,.5,-1.5708);c.fill();c.stroke();gl(-r*.25,-r*.3,.22);return;}
  if(f.type==="comet"){c.beginPath();c.moveTo(-r*2,0);c.lineTo(-r*.15,-r*.8);c.arc(0,0,r*.85,-1.4,1.4);c.lineTo(-r*.15,r*.8);c.closePath();c.fill();c.stroke();gl(-r*.2,-r*.3,.25);return;}
  if(f.type==="rock"){c.rotate(.45);u.rr(c,-r,-r,r*2,r*2,r*.3);c.fill();c.stroke();gl(-r*.4,-r*.4,.24);return;}
  c.beginPath();c.arc(0,0,r,0,6.283);c.fill();c.stroke();gl(-r*.3,-r*.32,.26);});}

const EK=1.5;
const ejSpr=col=>u.sprite("tse"+col,40,(c,R)=>{const r=R/EK;c.fillStyle=col;c.beginPath();c.arc(0,0,r,0,6.283);c.fill();c.strokeStyle=INK;c.lineWidth=Math.max(2,r*.22);c.stroke();
  c.fillStyle="rgba(255,241,214,.55)";c.beginPath();c.arc(-r*.3,-r*.32,r*.26,0,6.283);c.fill();});

// estrelas grandes do fundo (2 variantes) e planetas de cenário em silhueta com fio quente
const starSpr=v=>u.sprite("tsstar"+v,32,(c,R)=>{c.lineJoin="round";u.spikes(c,R*.9,v?5:4,v?.5:.38,-1.5708);c.fillStyle=v?PEACH:CREAM;c.fill();c.strokeStyle=INK;c.lineWidth=2;c.stroke();});
function propSpr(p,i){return u.sprite("tsprop"+i,256,(c,R)=>{const K=p.ring?2:1.2,r=R/K;c.lineJoin="round";
  if(p.ring){c.fillStyle=SIL;c.strokeStyle=PEACH;c.lineWidth=r*.05;c.beginPath();c.ellipse(0,0,r*1.8,r*.5,-.35,0,6.283);c.ellipse(0,0,r*1.35,r*.36,-.35,6.283,0,true);c.fill("evenodd");c.stroke();}
  c.fillStyle=SIL;c.beginPath();c.arc(0,0,r,0,6.283);c.fill();
  c.save();c.clip();c.strokeStyle=PEACH;c.lineWidth=r*.13;c.beginPath();c.arc(0,0,r*.94,-2.9,-.55);c.stroke();
  c.fillStyle="rgba(255,207,154,.1)";[-.45,.1,.5].forEach(y=>{c.beginPath();c.ellipse(0,r*y,r*1.05,r*.1,0,0,6.283);c.fill();});c.restore();
  c.strokeStyle=INK;c.lineWidth=r*.07;c.beginPath();c.arc(0,0,r,0,6.283);c.stroke();});}

// asteroide: silhueta roxa escura com aresta pêssego do lado do sol, 3 crateras, contorno de tinta (3 variantes × tier)
const AK=1.3;
function astSpr(variant,size){return u.sprite("tsa"+variant+size,size,(c,R)=>{const r=R/AK,seed=11+variant*7,n=9+variant*2;c.lineJoin="round";
  u.astPoly(c,r,seed,n);c.fillStyle=PEACH;c.fill();
  c.save();c.clip();c.translate(r*.15,r*.15);u.astPoly(c,r,seed,n);c.fillStyle="#3a2258";c.fill();c.restore();
  const cr=u.mulberry(seed*3);for(let i=0;i<3;i++){const a=cr()*6.28,d=cr()*r*.5,c2=r*(.12+cr()*.14);
    c.fillStyle=INK;c.beginPath();c.arc(Math.cos(a)*d,Math.sin(a)*d,c2,0,6.283);c.fill();c.strokeStyle="rgba(255,207,154,.35)";c.lineWidth=Math.max(1.5,r*.04);c.stroke();}
  u.astPoly(c,r,seed,n);c.strokeStyle=INK;c.lineWidth=Math.max(3,r*.1);c.stroke();});}

// buraco negro: disco ameixa com espiral, anel dourado e linhas de sucção coral (1 sprite, girado por h.spin)
const BK=2.4;
const bhSpr=()=>u.sprite("tsbh",256,(c,R)=>{const r=R/BK;c.lineJoin="round";c.lineCap="round";
  c.strokeStyle=CORAL;c.lineWidth=r*.12;for(let i=0;i<10;i++){const a=i/10*6.283+.3;c.beginPath();c.moveTo(Math.cos(a)*r*1.55,Math.sin(a)*r*1.55);c.lineTo(Math.cos(a+.25)*r*2.2,Math.sin(a+.25)*r*2.2);c.stroke();}
  c.fillStyle=INK;c.beginPath();c.arc(0,0,r*1.42,0,6.283);c.fill();
  c.fillStyle=SIL;c.beginPath();c.arc(0,0,r*1.3,0,6.283);c.fill();c.strokeStyle=GOLD;c.lineWidth=Math.max(3,r*.13);c.stroke();
  c.strokeStyle="#5a2f8e";c.lineWidth=r*.16;c.beginPath();for(let i=0;i<=90;i++){const k=i/90,a=k*6.283*2.2,rr=r*.15+k*r*1.0;i?c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):c.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);}c.stroke();

  c.fillStyle=INK;c.beginPath();c.arc(0,0,r*.5,0,6.283);c.fill();c.strokeStyle=GOLD;c.lineWidth=r*.07;c.stroke();});

window.THEME={
id:"toon-sunset",name:"Cartoon Crepúsculo",
desc:"Fim de tarde no espaço: o Cartoon Cósmico sob um céu laranja → magenta → roxo, com sol baixo, faixas de nuvem e cenário em silhueta com fio quente. A torção: no desktop os menus viram uma gaveta que entra pela direita (altura inteira, abas fixas no rodapé), deixando o mundo à vista ao lado; no celular em pé continuam folhas. Placar dourado em cima, pódio embaixo, radar quente e botões teal, ouro e coral.",
tags:["quente","gaveta","cartoon","pôr do sol"],swatch:["#ffb547","#e0417f"],
tokens:{bg:"#3b1f6b",surface:"#4a2a7a",text:"#fff1d6",muted:"#c9a6d8",accent:"#ffb547",accent2:"#ff5e6c",danger:"#ff3b5c",ok:"#2ec4b6",
  line:"#241238",radius:"14px",radiusLg:"20px",space:"14px",fontUi:"'Trebuchet MS',Verdana,sans-serif",fontMono:"'Courier New',monospace",
  shadow:"6px 6px 0 #241238"},
layout:{hud:"bubbles",nav:"drawer"},
rarityColor:{free:"#c9a6d8",common:"#2ec4b6",rare:"#7fb3ff",epic:"#e0417f",legendary:"#ffb547",earned:"#7ee08a",secret:"#ff5e6c"},
labels:{title:"🪐 PLANET.IO",tagline:"Conquiste a galáxia antes do sol se pôr!",play:"🚀 JOGAR",playAuto:"🚀 JOGAR (AUTO)",lbTitle:"PÓDIO",
  dead:"KABOOM!",deadSub:"— você virou poeira no fim da tarde —",respawn:"🔄 DE NOVO!",reconnTitle:"SINAL FRACO!",reconnSub:"Procurando o satélite… tentativa {n}/5",
  back:"◄",create:"➕ Criar sala",top5:"TOP 5 HOJE"},

init(g){const rand=u.mulberry(21);
  L=[.2,.45].map((f,li)=>({f,stars:Array.from({length:li?50:80},()=>({x:rand()*T,y:rand()*T,s:li?2.5+rand()*1.5:1.5+rand(),a:+(.35+rand()*.4).toFixed(2)}))}));

drawBg(c,W,H,cam,t,g){
  if(!bg||bgW!==W||bgH!==H){bgW=W;bgH=H;bg=document.createElement("canvas");bg.width=W;bg.height=H;const x=bg.getContext("2d");x.lineJoin="round";x.lineCap="round";
    const gd=x.createLinearGradient(0,0,0,H);gd.addColorStop(0,SIL);gd.addColorStop(.22,PLUM);gd.addColorStop(.6,MAG);gd.addColorStop(1,ORA);x.fillStyle=gd;x.fillRect(0,0,W,H);
    // sol baixo no horizonte: disco chapado dourado com contorno de tinta, cortado pela borda de baixo
    const D=Math.max(W,H),sr=D*.13,sx=W*.66,sy=H*.96;
    x.fillStyle="#ffd36b";x.beginPath();x.arc(sx,sy,sr,0,6.283);x.fill();x.strokeStyle=INK;x.lineWidth=5;x.stroke();

    const rand=u.mulberry(5);
    for(let i=0;i<7;i++){const y=H*(.5+i*.065)+rand()*H*.03,w=W*(.18+rand()*.34),h=9+rand()*12,xx=rand()*(W+w)-w;
      x.fillStyle="rgba(42,21,80,.6)";u.rr(x,xx,y,w,h,h/2);x.fill();
      x.strokeStyle="rgba(255,207,154,.8)";x.lineWidth=3;x.beginPath();x.moveTo(xx+h/2,y+2);x.lineTo(xx+w-h/2,y+2);x.stroke();
      if(rand()<.6){const w2=w*.5,x2=xx+w*.2;x.fillStyle="rgba(42,21,80,.6)";u.rr(x,x2,y-h*.55,w2,h*.8,h*.4);x.fill();}}
    // estrelas fixas só na parte roxa (alto)
    x.fillStyle=CREAM;for(let i=0;i<70;i++){const y=H*(rand()*.42);x.globalAlpha=.25+rand()*.5;x.fillRect(rand()*W,y,2,2);}x.globalAlpha=1;}
  c.drawImage(bg,0,0);
  if(g&&g.prefs&&!g.prefs.parallax)return;
  // parallax só acima do horizonte (parte roxa), com fade
  const Y0=H*.5,FD=H*.2;c.fillStyle=CREAM;
  L.forEach(l=>{const ox=((-cam.x*l.f*cam.scale)%T+T)%T,oy=((-cam.y*l.f*cam.scale)%T+T)%T;
    l.stars.forEach(s=>{const bx=(s.x+ox)%T,by=(s.y+oy)%T;for(let x=bx;x<W;x+=T)for(let y=by;y<H;y+=T){if(y>Y0)continue;c.globalAlpha=s.a*Math.min(1,(Y0-y)/FD);c.fillRect(x,y,s.s,s.s);}});});
  c.globalAlpha=1;
  const l=BIG,ox=((-cam.x*l.f*cam.scale)%T+T)%T,oy=((-cam.y*l.f*cam.scale)%T+T)%T,sp=[starSpr(0),starSpr(1)];
  l.stars.forEach(s=>{const bx=(s.x+ox)%T,by=(s.y+oy)%T,h=s.s/2;for(let x=bx;x<W;x+=T)for(let y=by;y<H;y+=T){if(y>Y0-FD*.5)continue;c.globalAlpha=Math.min(1,(Y0-y)/FD);c.drawImage(sp[s.v],x-h,y-h,s.s,s.s);}});
  c.globalAlpha=1;},

drawWorld(c,cam,t,g,W,H){
  const hw=W/(2*cam.scale),hh=H/(2*cam.scale);c.globalAlpha=.55;
  PROPS.forEach((p,i)=>{const R=p.r*(p.ring?2:1.2);if(Math.abs(p.x-cam.x)>hw+R||Math.abs(p.y-cam.y)>hh+R)return;c.drawImage(propSpr(p,i),p.x-R,p.y-R,R*2,R*2);});
  c.globalAlpha=1;
  if(!g||!g.prefs||g.prefs.grid)u.grid(c,150,"rgba(255,207,154,.09)",2);
  c.strokeStyle=INK;c.lineWidth=18;c.strokeRect(0,0,WW,WH);
  c.strokeStyle=GOLD;c.lineWidth=6;c.setLineDash([40,26]);c.strokeRect(0,0,WW,WH);c.setLineDash([]);},

drawFood(c,f,t){const p=f.type==="star"?1+Math.sin(t*.003+f.seed)*.14:1,r=f.r*FK*p,s=foodSpr(f);
  if(f.type==="rock"||f.type==="comet"){c.save();c.translate(f.x,f.y);c.rotate(f.seed);c.drawImage(s,-r,-r,r*2,r*2);c.restore();return;}
  const bob=FICON[f.type]?Math.sin(t*.005+f.seed)*3:0;c.drawImage(s,f.x-r,f.y-r+bob,r*2,r*2);},
drawEjected(c,e){const r=e.r*EK;c.drawImage(ejSpr(e.color),e.x-r,e.y-r,r*2,r*2);},

drawAsteroid(c,a,t){const r=a.r*AK;c.save();c.translate(a.x,a.y);c.rotate(a.rot);c.drawImage(astSpr(a.variant,u.tier(a.r)),-r,-r,r*2,r*2);c.restore();},

drawBlackHole(c,h,t){const k=h.k,rc=h.rc*k,ri=h.ri*k;
  c.strokeStyle=rgba(CORAL,.3+.1*Math.sin(t*.004));c.lineWidth=3;c.setLineDash([14,18]);c.beginPath();c.arc(h.x,h.y,ri,-h.spin*.4,-h.spin*.4+6.283);c.stroke();c.setLineDash([]);
  const R=rc*BK;c.save();c.translate(h.x,h.y);c.rotate(h.spin);c.globalAlpha=Math.min(1,k*1.2);c.drawImage(bhSpr(),-R,-R,R*2,R*2);c.restore();c.globalAlpha=1;},

drawTrail(c,pc,p,isMe){if(!u.trailPath(c,pc))return;
  c.strokeStyle=rgba(PEACH,isMe?.7:.42);c.lineWidth=Math.max(2,pc.r*.22);c.lineCap="round";c.lineJoin="round";
  c.setLineDash([pc.r*.35,pc.r*.35]);c.stroke();c.setLineDash([]);},

drawMissile(c,m,t){c.lineJoin="round";
  m.trail.forEach((pt,i)=>{if(i%2)return;const a=i/m.trail.length;c.fillStyle=`rgba(255,241,214,${a*.5})`;c.beginPath();c.arc(pt.x,pt.y,m.r*.7*a,0,6.283);c.fill();});
  c.save();c.translate(m.x,m.y);c.rotate(Math.atan2(m.vy,m.vx));const r=m.r,fl=1+.25*Math.sin(t*.05);
  c.fillStyle=GOLD;c.beginPath();c.moveTo(-r*1.1,0);c.lineTo(-r*2.4*fl,-r*.6);c.lineTo(-r*2*fl,0);c.lineTo(-r*2.4*fl,r*.6);c.closePath();c.fill();
  c.strokeStyle=INK;c.lineWidth=2.6;c.fillStyle=CORAL;
  c.beginPath();c.moveTo(r*1.6,0);c.quadraticCurveTo(r*.6,-r*.95,-r*.9,-r*.7);c.lineTo(-r*1.3,-r*1.1);c.lineTo(-r*1.3,r*1.1);c.lineTo(-r*.9,r*.7);c.quadraticCurveTo(r*.6,r*.95,r*1.6,0);c.closePath();c.fill();c.stroke();
  c.fillStyle=CREAM;c.beginPath();c.arc(r*.25,0,r*.36,0,6.283);c.fill();c.stroke();c.restore();},

drawCell(c,pc,p,isMe,t,prev,g){const r=pc.displayR||pc.r,sk=p.skin,d=r*PK(sk),pr=(g&&g.prefs)||{names:true,mass:true};
  c.drawImage(planetSpr(sk,isMe,u.tier(r)),pc.x-d,pc.y-d,d*2,d*2);
  c.save();c.translate(pc.x,pc.y);c.lineCap="round";
  if(pc.mergeTimer>0){c.strokeStyle=GOLD;c.lineWidth=Math.max(3,r*.08);c.beginPath();c.arc(0,0,r*1.18,-1.5708,-1.5708+(1-pc.mergeTimer/u.mergeTime(pc.r))*6.283);c.stroke();}
  const pw=Object.keys(p._powerups||{});
  if(pw.length){const cl={speed:GOLD,magnet:MAG,shield:TEAL};
    pw.forEach((k,i)=>{const a0=t*.001*(i%2?-1:1);c.strokeStyle=cl[k];c.lineWidth=Math.max(3,r*.08);c.globalAlpha=.6+.4*Math.sin(t*.012+i);
      c.setLineDash([r*.4,r*.3]);c.beginPath();c.arc(0,0,r*(1.3+i*.16),a0,a0+6.283);c.stroke();c.setLineDash([]);c.globalAlpha=1;});}
  if(!prev&&r>13){const fs=Math.max(12,r*.34);
    if(pr.names!==false)u.outText(c,p.name+(p.registered?" ✓":""),0,pr.mass!==false?-fs*.28:0,fs,"#fff",INK,FONT);
    if(pr.mass!==false)u.outText(c,u.fmt(pc.r*pc.r),0,pr.names!==false?fs*.8:0,fs*.68,PEACH,INK,FONT);}
  c.restore();},

drawFx(c,f,t){const k=f.age/f.ttl,a=1-k;c.lineJoin="round";c.lineCap="round";
  switch(f.t){
    case "bounce":{const s=f.r*(.7+k*.3)*(.6+(f.power||1)*.5);c.save();c.translate(f.x,f.y);c.rotate(f.nx*.6);
      u.spikes(c,s,8,.55,0);c.fillStyle=GOLD;c.fill();c.strokeStyle=INK;c.lineWidth=Math.max(2,s*.08);c.stroke();
      u.outText(c,"POW!",0,0,Math.max(10,s*.5),CREAM,INK,FONT);c.restore();break;}
    case "pop":{const s=f.r*(1+k*.8);c.save();c.translate(f.x,f.y);c.globalAlpha=Math.min(1,a*1.5);
      u.spikes(c,s,10,.5,k*.6);c.fillStyle=CORAL;c.fill();c.strokeStyle=INK;c.lineWidth=Math.max(2,s*.06);c.stroke();
      u.outText(c,"BOOM",0,0,Math.max(10,s*.42),GOLD,INK,FONT);c.restore();break;}
    case "boom":{const s=f.r*(.8+k*1.2);c.save();c.translate(f.x,f.y);c.globalAlpha=Math.min(1,a*1.5);
      u.spikes(c,s,12,.55,-k*.5);c.fillStyle=CORAL;c.fill();c.strokeStyle=INK;c.lineWidth=Math.max(2.5,s*.06);c.stroke();
      u.spikes(c,s*.55,12,.55,-k*.5);c.fillStyle=GOLD;c.fill();u.outText(c,"KABOOM!",0,0,Math.max(11,s*.34),CREAM,INK,FONT);c.restore();break;}
    case "eat":c.strokeStyle=`rgba(255,241,214,${a})`;c.lineWidth=3;c.beginPath();c.arc(f.x,f.y,f.r*(1.2+k*1.2),0,6.283);c.stroke();
      if(f.r>8)u.outText(c,"nom",f.x,f.y-f.r*(1+k*2),Math.max(9,f.r*.9),PEACH,INK,FONT);break;
    case "suck":c.strokeStyle=rgba(CORAL,a);c.lineWidth=4;c.beginPath();c.arc(f.x,f.y,f.r*(3-k*2.6),0,6.283);c.stroke();break;
    case "exit":case "split":case "merge":c.strokeStyle=`rgba(255,241,214,${a})`;c.lineWidth=3;c.beginPath();c.arc(f.x,f.y,f.r*(.6+k*1.5),0,6.283);c.stroke();break;
    case "chip":c.strokeStyle=rgba(GOLD,a);c.lineWidth=3;for(let i=-1;i<=1;i++){const an=Math.atan2(f.ny,f.nx)+i*.5;c.beginPath();c.moveTo(f.x,f.y);c.lineTo(f.x+Math.cos(an)*f.r*3*k,f.y+Math.sin(an)*f.r*3*k);c.stroke();}break;
    case "shoot":c.strokeStyle=rgba(CORAL,a);c.lineWidth=3;for(let i=0;i<8;i++){const an=i/8*6.283;c.beginPath();c.moveTo(f.x+Math.cos(an)*f.r*(1+k),f.y+Math.sin(an)*f.r*(1+k));c.lineTo(f.x+Math.cos(an)*f.r*(1.6+k*1.4),f.y+Math.sin(an)*f.r*(1.6+k*1.4));c.stroke();}break;
    case "rock":c.strokeStyle=`rgba(255,207,154,${a*.5})`;c.lineWidth=2;c.beginPath();c.arc(f.x,f.y,f.r*.4*(1+k),0,6.283);c.stroke();break;}},

// radar redondo no canto superior direito: cara quente, varredura dourada (o resto do HUD é DOM)
drawHud(c,W,H,g,t,mode){
  if(g.prefs&&!g.prefs.minimap)return;
  const D=mode==="portrait"?92:mode==="landscape"?84:150,MP=12,R=D/2,cx=W-MP-R,cy=MP+R;c.lineJoin="round";
  c.fillStyle=INK;c.beginPath();c.arc(cx+4,cy+4,R,0,6.283);c.fill();
  c.fillStyle="#5a2450";c.beginPath();c.arc(cx,cy,R,0,6.283);c.fill();c.strokeStyle=INK;c.lineWidth=4;c.stroke();
  c.strokeStyle="rgba(255,207,154,.3)";c.lineWidth=1.5;[.33,.66].forEach(k=>{c.beginPath();c.arc(cx,cy,R*k,0,6.283);c.stroke();});
  c.beginPath();c.moveTo(cx-R,cy);c.lineTo(cx+R,cy);c.moveTo(cx,cy-R);c.lineTo(cx,cy+R);c.stroke();
  const a=t*.0025;c.fillStyle="rgba(255,181,71,.2)";c.beginPath();c.moveTo(cx,cy);c.arc(cx,cy,R-2,a-.7,a);c.closePath();c.fill();
  c.strokeStyle=GOLD;c.lineWidth=2;c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.cos(a)*(R-2),cy+Math.sin(a)*(R-2));c.stroke();
  const S=D*.72,mx=cx-S/2,my=cy-S/2;
  c.save();c.beginPath();c.arc(cx,cy,R-2,0,6.283);c.clip();
  u.minimap(c,mx,my,S,g,{me:CREAM,player:GOLD,bot:TEAL,ast:"rgba(255,207,154,.75)",hole:"rgba(255,94,108,.85)",view:"rgba(255,241,214,.35)"});
  const me=g.players[g.me];
  if(me&&!me.dead&&me.pieces.length){const sc=S/WW,n=me.pieces.length,x=mx+me.pieces.reduce((s,q)=>s+q.x,0)/n*sc,y=my+me.pieces.reduce((s,q)=>s+q.y,0)/n*sc;
    c.fillStyle=CREAM;c.strokeStyle=INK;c.lineWidth=1.5;c.beginPath();c.arc(x,y,mode==="desktop"?4:3,0,6.283);c.fill();c.stroke();}
  c.restore();
  if(mode==="desktop"){c.font="bold 9px "+FONT;c.fillStyle=GOLD;c.textAlign="center";c.textBaseline="middle";c.fillText("RADAR",cx,cy+R-10);}},

paintSkin(c,sk,r){const rr=sk.ring?r*.68:r,d=rr*PK(sk);c.drawImage(planetSpr(sk,false,u.tier(rr)),-d,-d+2,d*2,d*2);},

css:`
/* ── BASE ── */
body{font-family:var(--font-ui);font-weight:700}

.btn-secondary:hover{background:#5fd8cc}
.btn-mini{background:#2ec4b6;border:3px solid var(--line);border-radius:10px;padding:6px 12px;font-size:12px;color:var(--line);font-weight:700;box-shadow:3px 3px 0 var(--line);white-space:nowrap;transition:transform .05s,box-shadow .05s}

.btn-mini:active{transform:translate(3px,3px);box-shadow:none}
.btn-link{color:var(--accent);text-decoration:underline;font-size:12px}

.nav-btn[data-nav="profile"] .nav-ico::before{content:"👤"}.nav-btn[data-nav="shop"] .nav-ico::before{content:"🛍️"}.nav-btn[data-nav="prefs"] .nav-ico::before{content:"⚙️"}

th{font-size:11px;color:var(--muted);border-bottom:3px solid var(--line);text-transform:uppercase}
td{font-size:13px;border-bottom:2px solid rgba(36,18,56,.35)}

.tbtn.cd,#t-fire.empty{opacity:1;background:#5e4a78;color:#b9a8c8;box-shadow:none;transform:translate(4px,4px)}
.tbtn.cd::before,#t-fire.empty::before{filter:grayscale(1);opacity:.5}
/* ── ENTRADA ── */
#s-entry{background:rgba(36,18,56,.12)}
#s-entry .entry-wrap{position:absolute;inset:0;left:0;right:0;bottom:0;transform:none;width:100%;height:100%;max-height:none;border:0;border-radius:0;background:transparent;box-shadow:none;padding:0;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:0}
#s-entry .entry-wrap::before{display:none}
.brand-block{padding-top:8vh;gap:8px}
.brand{font-size:56px;color:var(--accent);text-shadow:4px 4px 0 var(--line);letter-spacing:1px;transform:rotate(-3deg);line-height:1.1}
.tagline{font-size:13px;color:var(--text);background:var(--line);padding:4px 14px;border-radius:999px;border:3px solid var(--accent2)}
.entry-main{background:transparent;border:0;box-shadow:none;padding:0 16px 22px;width:min(440px,100%);gap:12px}

.entry-main .field input{border-radius:999px;text-align:center;max-width:320px}
.skinrow{order:1;background:var(--surface);border:4px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;width:auto;min-width:270px;box-shadow:4px 4px 0 var(--line)}

.skinmeta b{font-size:15px;color:#fff}.skinmeta i{font-style:normal;font-size:11px;text-transform:uppercase}
.entry-main .btn-primary{order:3;font-size:30px;padding:18px;border-radius:26px;border-width:5px;box-shadow:8px 8px 0 var(--line);transform:rotate(-1.5deg)}
.entry-main .btn-primary:active{transform:rotate(-1.5deg) translate(6px,6px);box-shadow:none}
/* ícones redondos: coluna vertical na borda direita (no retrato viram fileira, ver MOBILE) */
.entry-links{order:4;position:absolute;right:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;justify-content:center;gap:12px;width:auto}
.entry-links .btn-secondary{display:flex;flex-direction:column;align-items:center;gap:5px;width:66px;padding:0;background:none;border:0;box-shadow:none;font-size:10.5px;color:#fff;text-shadow:1px 1px 0 var(--line)}
.entry-links .btn-secondary::before{content:"";display:flex;align-items:center;justify-content:center;width:58px;height:58px;border-radius:50%;background:#2ec4b6;border:4px solid var(--line);box-shadow:4px 4px 0 var(--line);font-size:26px;transition:transform .05s,box-shadow .05s}
.entry-links [data-go="lobby"]::before{content:"🛰️";background:#2ec4b6}.entry-links [data-go="rank"]::before{content:"🏆";background:#ff5e6c}
.entry-links [data-go="profile"]::before{content:"👤";background:#ffb547}.entry-links [data-go="shop"]::before{content:"🛍️";background:#e0417f}.entry-links [data-go="prefs"]::before{content:"⚙️";background:#c9a6d8}
.entry-links .btn-secondary:hover{background:none}
.entry-links .btn-secondary:active{transform:none}
.entry-links .btn-secondary:active::before{transform:translate(4px,4px);box-shadow:none}
.guest-note{order:5;font-size:12px;color:var(--text);text-shadow:1px 1px 0 var(--line)}
.guest-note[data-kind="registered"] .gn-txt{color:var(--ok)}
.entry-main .hint{order:6;font-size:11px;text-align:center;color:var(--text);text-shadow:1px 1px 0 var(--line)}
.entry-side{display:none}
/* ── CONTA ── */
.overlay{background:rgba(36,18,56,.45);padding:0;backdrop-filter:blur(2px)}
.modal{position:absolute;left:auto;right:0;top:0;bottom:0;transform:none;width:min(480px,100%);height:100%;max-height:none;overflow:auto;border-radius:24px 0 0 24px;border:5px solid var(--line);border-right:0;
  background:var(--surface);padding:24px 22px 24px 30px;justify-content:safe center;box-shadow:-10px 0 40px rgba(0,0,0,.45)}
.modal::before{content:"";position:absolute;left:6px;top:50%;width:8px;height:64px;margin-top:-32px;border-radius:99px;background:var(--line);flex:none}
.modal-title{font-size:24px;color:var(--accent);text-shadow:3px 3px 0 var(--line);text-align:center}
.tabs{gap:4px;padding:0 6px;border-bottom:4px solid var(--line)}
.tabs button{flex:1;padding:9px;font-size:13px;color:var(--muted);background:#3b1f6b;border:4px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;margin-bottom:-4px}
.tabs button.on{background:var(--accent);color:var(--line)}
.modal-actions button{flex:1;padding:12px;font-size:15px}
/* ── LOBBY ── */
.lobby-hero{order:50;position:sticky;bottom:74px;z-index:2;background:var(--surface);border:0;border-top:4px solid var(--line);border-radius:0;box-shadow:none;margin:auto -16px 0 -22px;padding:10px 16px 12px 22px;grid-template-columns:auto 1fr auto;gap:10px;grid-template-areas:"me input enter" "create play play"}
.lobby-wrap .nav{margin-top:4px}
.me-chip{grid-area:me;background:#3b1f6b;border:3px solid var(--line);border-radius:999px;padding:4px 14px 4px 5px;width:max-content;box-shadow:3px 3px 0 var(--line)}
.me-chip canvas{width:40px;height:40px}
.me-chip b{font-size:15px;color:#fff}.me-chip i{font-style:normal;font-size:10px;color:var(--muted);text-transform:uppercase}
.me-chip i[data-kind="registered"]{color:var(--ok)}
.code-row{display:contents}
.code-row input{grid-area:input;text-align:center;letter-spacing:3px;font-size:17px;padding:8px 6px;min-width:0}
.code-row .btn-secondary:first-of-type{grid-area:enter;width:auto;padding:8px 16px}
.code-row .btn-secondary:last-of-type{grid-area:create;background:var(--accent2);padding:12px 14px;font-size:15px;white-space:nowrap}
.lobby-hero .btn-primary{grid-area:play;font-size:16px;padding:12px}
.lobby-hero .hint{display:none}
.room-list{background:transparent;border:0;box-shadow:none;padding:2px 0 0;gap:8px}
.room-row{background:#3b1f6b;border:3px solid var(--line);border-radius:12px;padding:6px 8px;grid-template-columns:70px 44px 1fr 44px 46px 78px;font-size:12.5px;color:#e8d8f0;box-shadow:3px 3px 0 var(--line)}
.room-row.head{background:transparent;border:0;box-shadow:none;padding:0 8px;font-size:10px;color:var(--muted);text-transform:uppercase}
.room-row.head .code{background:none;border:0;color:var(--muted);font-size:10px;padding:0;text-align:left;box-shadow:none}
.room-row .code{background:var(--accent);color:var(--line);border:3px solid var(--line);border-radius:8px;padding:3px 4px;text-align:center;font-size:13px;letter-spacing:1px}
.room-row .bar{background:var(--line);border-radius:4px;color:var(--ok);height:8px;border:1px solid var(--line)}
.room-row .btn-mini{background:var(--accent);padding:5px 10px}
.room-row.full{opacity:.5}
.lobby-side{display:none}
/* ── RANKING ── */
.toggles{flex-direction:column;gap:8px;align-items:stretch}
#rk-period button{flex:1;text-align:center}
#rk-metric{border:0;padding:0;gap:6px;justify-content:center}
#rk-metric button{border:3px solid var(--line);border-radius:999px;padding:5px 14px;font-size:11px;margin:0}
.rank-table{background:transparent;border:0;box-shadow:none;padding:0;max-height:none;overflow:visible}
#rk-table td{padding:7px 8px}
#rk-table tr.me td{background:var(--accent);color:var(--line)}
#rk-table tr.top1 .c-rank,#rk-table tr.top2 .c-rank,#rk-table tr.top3 .c-rank{font-size:0;text-align:center}
#rk-table tr.top1 .c-rank::before{content:"🥇";font-size:20px}#rk-table tr.top2 .c-rank::before{content:"🥈";font-size:20px}#rk-table tr.top3 .c-rank::before{content:"🥉";font-size:20px}
.c-delta.up{color:var(--ok)}.c-delta.down{color:var(--accent2)}
.rank-me{position:sticky;bottom:82px;z-index:2;background:var(--accent);color:var(--line);border-radius:999px;padding:8px 20px;justify-content:center;box-shadow:4px 4px 0 var(--line);margin:auto 0 8px}
.rank-wrap .nav{margin-top:4px}
.rank-me b{font-size:24px}
/* ── PERFIL ── */
.profile-head{background:transparent;border:0;box-shadow:none;padding:0;flex-wrap:wrap}
.profile-head canvas{width:80px;height:80px}
.pf-nick{font-size:24px;color:#fff;text-shadow:2px 2px 0 var(--line)}
.pf-kind{font-style:normal;font-size:11px;color:var(--muted);text-transform:uppercase}
.pf-kind[data-kind="registered"]{color:var(--ok)}
.pf-meta .coinbar{width:max-content}
.stat-cards{grid-template-columns:repeat(3,1fr);gap:12px 10px;padding:0 4px 4px 0}
.stat{padding:10px 6px;border-radius:18px;border:4px solid var(--line);background:#2ec4b6;color:var(--line);box-shadow:4px 4px 0 var(--line)}
.stat:nth-child(2){background:var(--accent);transform:rotate(1.5deg)}.stat:nth-child(3){background:#ffcf9a}.stat:nth-child(4){background:#e0417f;transform:rotate(-1.5deg)}
.stat:nth-child(5){background:var(--accent2)}.stat:nth-child(6){background:#c9a6d8;transform:rotate(1deg)}
.stat b{font-size:22px;color:var(--line)}.stat i{font-style:normal;font-size:9.5px;font-weight:700;text-transform:uppercase;line-height:1.1}
.pf-hist{overflow-x:auto;padding:10px 12px}
#pf-table th{font-size:10px;padding:5px 6px}
#pf-table td{font-size:11.5px;padding:5px 6px;white-space:nowrap}
#pf-table th:nth-child(2),#pf-table td:nth-child(2),#pf-table th:nth-child(6),#pf-table td:nth-child(6){display:none}
.pf-hist td.cause{color:var(--muted)}.pf-hist td.cause.blackhole{color:#e0417f}.pf-hist td.cause i{font-style:normal;color:#fff}
.ach-grid{grid-template-columns:1fr}
.ach{padding:8px 10px;border:3px solid var(--line);border-radius:14px;background:#3b1f6b;opacity:.6}
.ach.done{opacity:1;background:#1f4a46;border-color:var(--ok)}
.ach.secret{opacity:.4}
.ach b{font-size:13px;color:#fff}.ach i{font-size:11px;color:var(--muted)}
.ach-bar{background:var(--line);color:var(--accent);border-radius:4px;height:6px;margin-top:4px}
.ach.done .ach-bar{color:var(--ok)}
.ach-coins{font-style:normal;font-size:12px;color:var(--accent)}
/* ── LOJA ── */
.shop-eq{background:#3b1f6b;padding:10px 14px}
.shop-eq .badge{position:static;margin-left:auto}
.shop-eq .skinmeta b{font-size:16px}
.filters button{padding:6px 12px;border-radius:999px;border:3px solid var(--line);background:#3b1f6b;font-size:11px;color:var(--muted);font-weight:700}
.filters button.on{background:var(--rc,var(--accent));color:var(--line)}
.shop-grid{grid-template-columns:repeat(3,1fr);max-height:none;overflow:visible;gap:14px;padding:6px 6px 10px 2px}
.skin-card{background:#5a3690;border:4px solid var(--rc);border-radius:18px;color:var(--text);box-shadow:4px 4px 0 var(--line);padding:12px 6px 10px;transition:transform .1s}
.skin-card:nth-child(3n+1){transform:rotate(-1.5deg)}.skin-card:nth-child(3n){transform:rotate(1.5deg)}
.skin-card:hover{transform:translateY(-3px) rotate(0);background:#66409f}
.skin-card.eq{background:var(--accent);color:var(--line);border-color:#fff}
.skin-card.eq i,.skin-card.eq em{color:var(--line)}
.skin-card.locked,.skin-card.secret{opacity:.55;filter:grayscale(.4)}.skin-card.poor em{color:var(--accent2)}
.skin-card b{font-size:12.5px}.skin-card i{font-style:normal;font-size:9.5px;color:var(--rc);text-transform:uppercase}
.skin-card em{font-style:normal;font-size:12px;color:var(--accent);font-weight:700}
.badge{background:var(--accent);color:var(--line);font-size:9px;font-weight:700;padding:3px 7px;border-radius:8px;border:2px solid var(--line)}
.shop-note{font-size:11px;padding-bottom:4px}
/* ── PREFS ── */
.pg{padding:10px 14px;background:#3b1f6b}
.pg h2{font-size:13px;color:var(--accent);text-shadow:2px 2px 0 var(--line);text-transform:uppercase;letter-spacing:1px}
.pref-row{border-bottom:2px solid rgba(36,18,56,.4);font-size:13px;padding:8px 0}
.pref-row:last-child{border-bottom:0}
.toggle{width:58px;height:32px;border-radius:16px;background:#5e4a78;border:3px solid var(--line);color:#fff}
.toggle i{top:2px;left:2px;width:22px;height:22px;background:#fff;border:2px solid var(--line)}
.toggle[aria-checked="true"]{background:var(--ok)}
.toggle[aria-checked="true"] i{left:24px}
input[type=range]{accent-color:var(--accent)}
.prefs-foot{position:sticky;bottom:74px;z-index:2;background:var(--surface);margin:auto -16px 0 -22px;padding:10px 16px 12px 22px;border-top:4px solid var(--line)}
.prefs-wrap .nav{margin-top:4px}
.prefs-foot button{padding:10px 20px;font-size:14px}
/* ── MORTE ── */
#s-dead{background:rgba(60,14,50,.4)}
#s-dead .dead-card{position:absolute;left:auto;right:0;top:0;bottom:0;transform:none;width:min(480px,100%);height:100%;max-height:none;overflow:auto;border-radius:24px 0 0 24px;border:5px solid var(--line);border-right:0;
  background:#2a1240;padding:20px 20px 22px 28px;gap:10px;justify-content:safe center;box-shadow:-10px 0 40px rgba(0,0,0,.45)}
#s-dead .dead-card::before{content:"";position:absolute;left:6px;top:50%;width:8px;height:64px;margin-top:-32px;border-radius:99px;background:var(--line);flex:none}
.dead-icon{font-size:60px;line-height:1}
.dead-title{font-size:46px;color:var(--accent2);text-shadow:4px 4px 0 var(--line);transform:rotate(-4deg);letter-spacing:1px;line-height:1}
.dead-sub{font-size:12px;color:#d8a6c8}
.dead-by{background:var(--line);border-radius:999px;padding:6px 20px}
.dead-by span{font-size:10px;color:#d8a6c8;letter-spacing:2px}.dead-by b{font-size:22px;color:var(--accent)}
.dead-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:min(320px,100%);padding:4px 6px}
.dead-stats div{background:#2ec4b6;border:4px solid var(--line);border-radius:16px;padding:8px 10px;min-width:96px;color:var(--line);box-shadow:4px 4px 0 var(--line);transform:rotate(-2deg)}
.dead-stats div:nth-child(2){background:var(--accent);transform:rotate(2deg)}.dead-stats div:nth-child(3){background:#ffcf9a;transform:rotate(-1deg)}.dead-stats div:nth-child(4){background:#e0417f;transform:rotate(2deg)}
.dead-stats b{font-size:22px}.dead-stats i{font-style:normal;font-size:9.5px;text-transform:uppercase}
.dead-rank span{font-size:10px;color:#d8a6c8;letter-spacing:2px}.dead-rank b{font-size:18px;color:#fff}.dead-rank .arrow{color:var(--ok)}
.dead-actions{flex-direction:row}
.dead-actions .btn-primary{font-size:18px;padding:12px}
/* ── RECONN ── */
.modal.reconn{left:50%;right:auto;top:45%;bottom:auto;height:auto;transform:translate(-50%,-50%);width:min(340px,92%);max-height:none;overflow:visible;border-radius:28px;border:5px solid var(--line);background:var(--text);color:var(--line);padding:22px 22px 24px;justify-content:center;box-shadow:var(--shadow)}
.modal.reconn::before{display:none}
.modal.reconn::after{content:"";position:absolute;left:44px;bottom:-19px;width:26px;height:26px;background:var(--text);border-right:5px solid var(--line);border-bottom:5px solid var(--line);transform:rotate(45deg)}
.spinner{width:52px;height:52px;border:5px solid var(--line);border-top-color:var(--accent2)}
.rc-title{font-size:24px;color:var(--accent2);text-shadow:2px 2px 0 var(--line)}
.rc-title::before{content:"📡 "}
.rc-sub{font-size:13px;color:#5a3a70}
.reconn .btn-secondary{width:auto;padding:10px 22px}
