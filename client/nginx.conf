# Front + porta de entrada única: estáticos em /, API em /api e WebSocket em /ws/<shard>.
# proxy_pass com variável + resolver: o nginx sobe mesmo se o backend ainda não existir
# e resolve o DNS a cada request (importante durante rollout).
server {
  listen 8080;
  server_name _;
  resolver 10.96.0.10 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/html application/javascript text/css application/json;

  location = /nginx-health { return 200 "ok\n"; add_header Content-Type text/plain; }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

  # O painel /admin é uma rota da MESMA SPA (main.jsx carrega o chunk sob demanda): o fallback abaixo já o
  # serve. `noindex` porque uma tela de login de administração não tem por que estar num buscador.
  location /admin { try_files $uri /index.html; add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex, nofollow"; }

  # ⚠️ A POLÍTICA DE PRIVACIDADE PRECISA DE UMA URL SEM EXTENSÃO, E O `try_files` MENTIA SOBRE ELA.
  #    É a mesma armadilha do /ads.txt (docs/spec/portais.md): sem uma regra própria, `GET /privacy` cai
  #    no fallback de baixo e responde 200 com o index.html — o jogo, não a política. O revisor do
  #    portal abre o link que a gente escreveu no formulário DELE e vê a tela inicial do jogo; não há
  #    404, não há erro, e a recusa do outro lado não explica nada disso. A Poki pede a política para
  #    liberar a CSP do servidor externo, então esta linha faz parte da aprovação.
  location = /privacy { try_files /privacy.html =404; add_header Cache-Control "no-cache"; }
  location = /privacidade { try_files /privacy.html =404; add_header Cache-Control "no-cache"; }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # ⚠️ NÃO acrescente aqui X-Frame-Options nem CSP `frame-ancestors`. O cliente também é publicado
  #    como .zip em portais de jogo, que o servem DENTRO de um iframe (docs/spec/portais.md) — e um
  #    'hardening' desses mataria essa distribuição em silêncio, sem erro em lugar nenhum.
  location /api/ {
    set $api "warspace-server-api.warspace.svc.cluster.local:3000";
    proxy_pass http://$api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # /ws/<shard> -> pod warspace-server-<shard> (Service dedicado por pod)
  location ~ ^/ws/(\d+)$ {
    set $shard $1;
    set $backend "warspace-server-$shard.warspace.svc.cluster.local:3000";
    proxy_pass http://$backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }
}
