<!DOCTYPE html>
<html lang="pt-BR" data-theme="dawn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1b2450">
  <title>warspace.io — conquiste a galáxia</title>
  <meta name="description" content="warspace.io — agar.io espacial multiplayer: cresça, divida, ejete e devore. Modo livre e battle royale de 50 planetas numa zona que fecha.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- a fonte da marca é auto-hospedada; o preload tira o "flash de fonte trocada" do primeiro paint -->
  <link rel="preload" href="/fonts/archivo-black-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- cartão de compartilhamento: sem isto, um link colado no chat vira só a URL crua -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="warspace.io">
  <meta property="og:title" content="warspace.io — conquiste a galáxia">
  <meta property="og:description" content="Cresça, divida, ejete e devore. Livre ou battle royale de 50 planetas numa zona que fecha.">
  <meta property="og:image" content="/og.png">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body data-mode="desktop">
  <!-- #app é a raiz do React: canvas do jogo (#game), HUD, telas, overlays e #toast nascem aqui dentro -->
  <div id="app"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
