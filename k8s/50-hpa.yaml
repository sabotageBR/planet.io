# ── AUTOESCALA ────────────────────────────────────────────────────────────────
# ⚠️ LEIA ISTO ANTES DE MEXER: o servidor do jogo NÃO é stateless, e é por isso que este arquivo é
# assimétrico — ele SOBE sozinho e DESCE só na mão.
#
# Uma sala vive na MEMÓRIA de um pod: o código dela começa pelo índice do shard (`rooms/codes.js`),
# o Ingress manda `/ws/<n>` para o Service daquele pod e o cliente pega o shard do pod que respondeu
# `/api/config`. Tirar um pod não "redistribui carga": mata todas as partidas que estavam nele, no
# meio da rodada, junto com o placar da sala. Por isso `scaleDown` está DESABILITADO — reduzir shard
# é decisão de manutenção, feita numa janela, e não uma reação a dois minutos de CPU baixa.
#
# ⚠️ O HPA só mexe em `replicas`. Ele NÃO cria o Service `warspace-server-<n>` nem o path `/ws/<n>`
# do Ingress — sem os dois, um pod novo sobe e fica INALCANÇÁVEL, sem erro em lugar nenhum. Por isso
# `k8s/10-server.yaml` e `k8s/30-ingress.yaml` trazem 24 (Service + rota), e `maxReplicas` aqui pode
# ficar ABAIXO desse número sem problema — é subir `maxReplicas` acima do que os manifestos provêm
# que cria pod fantasma, nunca o contrário.
# ⚠️ `SHARDS` no ConfigMap continua 24 (o mesmo TETO de sempre, não a contagem viva): é dele que sai a
# lista de peers de cada pod (party e `/api/rooms` entre irmãos) e o guarda `dono < config.shards` do
# roteamento por código de sala. Manter SHARDS acima de `maxReplicas` é inofensivo — os índices ainda
# sem pod apenas não resolvem no DNS, o que falha rápido e não atrapalha.
# ⚠️ E `replicas` foi REMOVIDO do StatefulSet de propósito (ver o comentário lá): declarado nos dois
# lugares, cada `deploy.sh` desfaria o que o HPA fez.
#
# Medido em 2026-09-03 (scripts/loadtest.mjs, 500 jogadores em 12 shards): 500/500 dentro, RTT p50
# 37 ms, shard mais carregado em 790–918m de 1000m. É daí que sai o alvo de 700m: acima disso o RTT
# começa a subir. O laço do jogo é Node single-thread e não passa de ~1 core sozinho, então os 700m
# de alvo seguem valendo como medida de CAPACIDADE.
# ⚠️ O POD NÃO TEM MAIS `limits.cpu` (2026-09-17; já foi 1 e depois 2 cores). Capacidade e LATÊNCIA são
# perguntas diferentes, e o limite respondia errado à segunda: ele é uma cota do CFS somada entre as 11
# threads do processo, e as rajadas do GC paralelo a estouravam com 0,3 core de uso médio — o kernel
# congelava o shard inteiro ~1×/11 s. Era o engasgo do jogo. O porquê completo, com as medições, está no
# bloco `resources` de `k8s/10-server.yaml`. `minReplicas`/`maxReplicas` já foram 3–9; ver abaixo.
# ⚠️ O TETO VOLTOU A 20 em 07/09/2026, com `minReplicas` intacto em 3: os Fit Tests da Poki despejam
# ~500 jogadores numa janela de duas horas em cima de uma frota que fica ociosa o resto do dia (medido:
# 0 a 2 contas por hora fora dos testes), e `ROOM.BOTS`=50 encareceu a sala. O piso continua 3 porque é
# ele que paga o dia inteiro; o teto é a folga para a rajada.
# ⚠️ E ELE NÃO SUBSTITUI O MATCHMAKING — aprendido no travamento de 2026-09-05. A métrica é a CPU MÉDIA
# da frota, então 1198m + 377m + 159m dá 578m e o HPA vê "está tudo bem" com um pod saturado e dois
# ociosos: a média é justamente o que ESCONDE o desbalanceamento. E subir não resolveria, porque um shard
# novo só recebe QUEM ENTRAR DEPOIS — com o `/api/auto` mandando todo mundo para a sala mais cheia do
# cluster, ele nasceria vazio e ficaria vazio (o shard 0 daquele dia tinha UM jogador). Quem distribui é
# `server/src/rooms/matchmaking.js`; a autoescala só vale alguma coisa depois que a carga se espalha.
apiVersion: autoscaling/v2beta2   # o cluster é k8s 1.21: `autoscaling/v2` só existe a partir do 1.23
kind: HorizontalPodAutoscaler
metadata:
  name: warspace-server
  namespace: warspace
  labels: {app: warspace-server}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: StatefulSet, name: warspace-server}
  # ⚠️ PISO 3, e ele não derruba nada sozinho: `scaleDown: Disabled` logo abaixo continua valendo, então
  # baixar este número NÃO recolhe os pods que já estão de pé — ele só diz até onde o HPA pode deixar a
  # frota chegar. Reduzir de verdade é escalar o StatefulSet À MÃO, e isso MATA as partidas que estão na
  # memória dos pods removidos (sala é estado local do processo): manutenção em janela, nunca reação.
  minReplicas: 3
  # ⚠️ 20 é decisão operacional (07/09/2026, era 9), ainda abaixo do que `k8s/10-server.yaml` e
  # `k8s/30-ingress.yaml` provêm — CONFERIDO no cluster: 24 Services `warspace-server-N` e 24 rotas
  # `/ws/N`, índices 0..23. É subir `maxReplicas` ACIMA do que os manifestos provêm que cria pod
  # fantasma (sobe e fica inalcançável, sem erro em lugar nenhum), nunca o contrário.
  # ⚠️ E lembrar que subir aqui é BARATO e descer NÃO EXISTE: `scaleDown: Disabled` vale sempre, então
  # um pico que leve a frota a 20 a deixa em 20 até alguém escalar o StatefulSet à mão, numa janela.
  # O teto protege o cluster, não a conta: sem `limits.cpu`, o que segura a frota é ESTE número (um shard
  # não passa de ~1,3 core — a thread principal mais as auxiliares do V8) e o `requests.cpu: 1` de cada pod.
  # Se um dia `maxReplicas` precisar passar de 24, aí sim exige arrumar o `shardChar` primeiro: o 1º
  # caractere do código da sala é o shard em base36 (`rooms/codes.js`), e o shard 24 abriria salas com
  # "O" — a letra que `CODE_CHARS` exclui de propósito para ninguém confundir com 0 num convite.
  maxReplicas: 20
  metrics:
    # AverageValue, não Utilization: `Utilization` é uma porcentagem do REQUEST, e o request é uma
    # escolha de AGENDAMENTO (hoje 1 core; já foi 200m, quando um pod em 750m apareceria como 375% e o HPA
    # iria direto ao teto na primeira partida movimentada). O que interessa aqui é o valor absoluto contra
    # o core que a thread principal consegue usar — e é por ser absoluto que mexer no request não mexe aqui.
    - type: Resource
      resource:
        name: cpu
        target: {type: AverageValue, averageValue: 700m}
  behavior:
    scaleUp:
      # Um shard novo nasce vazio e só recebe QUEM ENTRAR DEPOIS (o cliente escolhe o shard no
      # `/api/config`), então subir cedo não alivia quem já está numa sala cheia — mas prepara a
      # próxima leva. 60 s de janela evita reagir a um pico de 15 s.
      stabilizationWindowSeconds: 60
      policies:
        - {type: Pods, value: 4, periodSeconds: 60}   # no máximo 4 shards novos por minuto
      selectPolicy: Max
    scaleDown:
      selectPolicy: Disabled   # ⚠️ ver o cabeçalho: descer = matar as partidas do pod removido
---
# O CLIENTE é o caso fácil: nginx servindo estáticos, sem estado nenhum. Aqui a autoescala é a
# convencional, nos dois sentidos, porque tirar uma réplica não custa nada a ninguém.
apiVersion: autoscaling/v2beta2
kind: HorizontalPodAutoscaler
metadata:
  name: warspace-client
  namespace: warspace
  labels: {app: warspace-client}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: warspace-client}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}   # request é 50m: aqui a porcentagem serve
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # 5 min de calmaria antes de devolver réplica, para não oscilar
