# Configuração não-secreta dos shards. O Secret warspace-db (DATABASE_URL) é criado por scripts/db-secret.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: warspace-config
  namespace: warspace
  labels: {app: warspace-server}
data:
  SHARDS: "24"
  PEER_HOST: "warspace-server.warspace.svc.cluster.local"
  PEER_NAME: "warspace-server"
  ROOM_MAX: "30"
  ROOM_BOTS: "15"
  ROUND_TICKS: "108000"   # rodada de 30 min a 60 Hz = 2 dias do relógio do espaço (fim do mundo + sala nova)
  # 0 = usa o mundo do build (12000 px de lado). Este env é só a SEMENTE: quem manda de verdade é o
  # parâmetro WORLD.LADO do /admin, e ele vale no próximo boot do pod — trocar o mundo com salas rodando
  # não tem conserto (a zona já foi sorteada e os clientes já quantizaram posições na escala velha).
  WORLD_SIDE: "0"
  PORT: "3000"
  DB_POOL_MAX: "5"
  MIGRATE_ON_START: "1"
  ROLE: "both"
  LOG_LEVEL: "info"
  # ── O CLIENTE PODE MORAR FORA DAQUI ──
  # Ele virou um .zip que os portais de jogos hospedam no domínio DELES, num iframe, enquanto a API e o
  # WS continuam neste cluster. Estas são as origens que podem falar com /api; vazio = fechado.
  # ⚠️ `__HOST__` é trocado pelo deploy.sh EM TODOS OS YAML, então a própria origem acompanha o
  # WARSPACE_HOST sozinha. ⚠️ Isto entra por envFrom: aplicar o ConfigMap NÃO reinicia pod nenhum e a
  # origem nova não vale, sem erro — é preciso `kubectl rollout restart statefulset/warspace-server`,
  # que derruba um shard por vez e mata as salas dele. Por isso o sufixo `*.` vale mais que a origem
  # exata em portal com subdomínio instável: errar a lista custa um rollout.
  ALLOWED_ORIGINS: "https://__HOST__,https://html5.gamedistribution.com,https://revision.gamedistribution.com,https://*.crazygames.com,https://*.poki.com,https://*.poki.io,https://*.poki.dev,https://*.poki-cdn.com,https://*.poki-gdn.com,https://*.poki-user-content.com,https://*.itch.zone,https://*.y8.com,https://*.gamemonetize.co,https://*.gamemonetize.com,https://*.gameflare.com,https://*.playgama.com,https://*.playgama.net,https://*.gamepix.com"
  # off | warn | on — ver .env.example. Estreia em off; só depois de LER os avisos de `warn` é que fecha.
  WS_ORIGIN_CHECK: "off"
  # O X-Forwarded-For que chega aqui é o IP DE UMA PESSOA? Desde 2026-09-03, sim: o controller do
  # ingress foi fixado no kube-master (o nó por onde o tráfego entra) e o Service dele passou a
  # `externalTrafficPolicy: Local`, então não há mais o SNAT do kube-proxy que apagava a origem —
  # antes o servidor via `10.32.0.1` para o mundo inteiro e todo limite "por IP" era um teto global.
  # ⚠️ Com `0` (ou com o ingress revertido para `Cluster`), o router volta a dimensionar os baldes de
  # IP por SHARD, que é a única coisa sensata quando o endereço não identifica ninguém.
  # ⚠️ Só é seguro porque o ingress-nginx está com `use-forwarded-headers` DESLIGADO: ele SUBSTITUI o
  # header pelo remote_addr real, então o cliente não consegue forjar o próprio IP. Ligar aquilo lá e
  # isto aqui ao mesmo tempo devolveria a forja a qualquer um.
  TRUST_CLIENT_IP: "1"
  # fala dos bots pela LLM: o Ollama vive fora do cluster, na 192.168.8.251 (rede roteada até os nós).
  # Fora do ar, o chat cai sozinho no repertório fixo — nada aqui é obrigatório para o jogo subir.
  OLLAMA_URL: "http://192.168.8.251:11434"
  # SEMENTE do boot: o modelo é tunable (/admin → Parâmetros → Fala dos bots), então trocá-lo aqui só
  # decide com o que os pods SOBEM — o que estiver em admin_settings ganha 30 s depois.
  OLLAMA_MODEL: "gpt-oss:20b"
  OLLAMA_MAX_INFLIGHT: "4"   # gerações simultâneas por PROCESSO; ⚠️ inútil acima do OLLAMA_NUM_PARALLEL da máquina do Ollama
  BOT_CHAT_LLM: "1"
  # Login com Google. O client_id é PÚBLICO por definição (vai no HTML da página), então é ConfigMap
  # e não Secret. O `client_secret` do console não entra em lugar nenhum: o fluxo é o do Google
  # Identity Services, em que o servidor só VALIDA o id_token — não há troca de code por token.
  # Vazio = /api/auth/google devolve 503 e o botão nem aparece na tela.
  GOOGLE_CLIENT_ID: "50404130816-m19kptkspjtnrql7h9orov9l2kpb913d.apps.googleusercontent.com"
  # ── PAINEL /admin ──
  # As contas destes e-mails viram administradoras no boot. SÓ PROMOVE, nunca rebaixa: rebaixar por
  # ConfigMap significaria que apagar uma vírgula aqui tranca todo mundo para fora do painel — rebaixar é
  # ação do próprio /admin, auditada, e com dois pisos (ninguém se rebaixa, e o último admin não cai).
  # ⚠️ Só funciona para conta REGISTRADA (com senha): o painel entra pelo mesmo scrypt do login do jogo.
  # Sem nenhuma conta promovida não há como entrar — e é de propósito que não exista rota para promover.
  ADMIN_EMAILS: "evandro@trixti.com.br,evandro@example.com"
