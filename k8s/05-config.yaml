# Configuração não-secreta dos shards. O Secret planet-db (DATABASE_URL) é criado por scripts/db-secret.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: planet-config
  namespace: planet
  labels: {app: planet-server}
data:
  SHARDS: "3"
  PEER_HOST: "planet-server.planet.svc.cluster.local"
  PEER_NAME: "planet-server"
  ROOM_MAX: "30"
  ROOM_BOTS: "15"
  ROUND_TICKS: "216000"   # rodada de 1 h a 60 Hz = 4 dias do relógio do espaço (fim do mundo + sala nova)
  PORT: "3000"
  DB_POOL_MAX: "5"
  MIGRATE_ON_START: "1"
  ROLE: "both"
  LOG_LEVEL: "info"
  # fala dos bots pela LLM: o Ollama vive fora do cluster, na 192.168.8.251 (rede roteada até os nós).
  # Fora do ar, o chat cai sozinho no repertório fixo — nada aqui é obrigatório para o jogo subir.
  OLLAMA_URL: "http://192.168.8.251:11434"
  OLLAMA_MODEL: "qwen3.6:35b-a3b"
  BOT_CHAT_LLM: "1"
