# Configuração não-secreta dos shards. O Secret warspace-db (DATABASE_URL) é criado por scripts/db-secret.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: warspace-config
  namespace: warspace
  labels: {app: warspace-server}
data:
  SHARDS: "3"
  PEER_HOST: "warspace-server.warspace.svc.cluster.local"
  PEER_NAME: "warspace-server"
  ROOM_MAX: "30"
  ROOM_BOTS: "15"
  ROUND_TICKS: "108000"   # rodada de 30 min a 60 Hz = 2 dias do relógio do espaço (fim do mundo + sala nova)
  PORT: "3000"
  DB_POOL_MAX: "5"
  MIGRATE_ON_START: "1"
  ROLE: "both"
  LOG_LEVEL: "info"
  # fala dos bots pela LLM: o Ollama vive fora do cluster, na 192.168.8.251 (rede roteada até os nós).
  # Fora do ar, o chat cai sozinho no repertório fixo — nada aqui é obrigatório para o jogo subir.
  OLLAMA_URL: "http://192.168.8.251:11434"
  OLLAMA_MODEL: "qwen3.6:35b-a3b"
  OLLAMA_MAX_INFLIGHT: "4"   # gerações simultâneas por PROCESSO; ⚠️ inútil acima do OLLAMA_NUM_PARALLEL da máquina do Ollama
  BOT_CHAT_LLM: "1"
  # Login com Google. O client_id é PÚBLICO por definição (vai no HTML da página), então é ConfigMap
  # e não Secret. O `client_secret` do console não entra em lugar nenhum: o fluxo é o do Google
  # Identity Services, em que o servidor só VALIDA o id_token — não há troca de code por token.
  # Vazio = /api/auth/google devolve 503 e o botão nem aparece na tela.
  GOOGLE_CLIENT_ID: "50404130816-m19kptkspjtnrql7h9orov9l2kpb913d.apps.googleusercontent.com"
  # ── PAINEL /admin ──
  # As contas destes e-mails viram administradoras no boot. SÓ PROMOVE, nunca rebaixa: rebaixar por
  # ConfigMap significaria que apagar uma vírgula aqui tranca todo mundo para fora do painel — rebaixar é
  # ação do próprio /admin, auditada, e com dois pisos (ninguém se rebaixa, e o último admin não cai).
  # ⚠️ Só funciona para conta REGISTRADA (com senha): o painel entra pelo mesmo scrypt do login do jogo.
  # Sem nenhuma conta promovida não há como entrar — e é de propósito que não exista rota para promover.
  ADMIN_EMAILS: "evandro@trixti.com.br,evandro@example.com"
