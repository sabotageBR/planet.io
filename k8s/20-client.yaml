apiVersion: apps/v1
kind: Deployment
metadata:
  name: warspace-client
  namespace: warspace
  labels: {app: warspace-client}
spec:
  # ⚠️ SEM `replicas`: quem manda é o HPA (k8s/50-hpa.yaml). Declarado nos dois lugares, cada
  # `deploy.sh` devolveria o número do arquivo e desfaria a escala.
  selector:
    matchLabels: {app: warspace-client}
  template:
    metadata:
      labels: {app: warspace-client}
    spec:
      containers:
        - name: nginx
          image: __IMAGE_CLIENT__
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /nginx-health, port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests: {cpu: 50m,  memory: 64Mi}
            limits:   {cpu: 500m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: warspace-client
  namespace: warspace
  labels: {app: warspace-client}
spec:
  selector: {app: warspace-client}
  ports:
    - {name: http, port: 80, targetPort: 8080}
---
# porta fixa para testar antes de existir domínio: http://<ip-do-no>:30800
apiVersion: v1
kind: Service
metadata:
  name: warspace-client-np
  namespace: warspace
  labels: {app: warspace-client}
spec:
  type: NodePort
  selector: {app: warspace-client}
  ports:
    - {name: http, port: 80, targetPort: 8080, nodePort: 30800}
