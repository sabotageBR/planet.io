  name: warspace-server-0
  namespace: warspace
  labels: {app: warspace-server, shard: "0"}
spec:
  selector:
    app: warspace-server
    statefulset.kubernetes.io/pod-name: warspace-server-0
  ports: [{name: http, port: 3000, targetPort: 3000}]
