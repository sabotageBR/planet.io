# Headless: dá DNS estável por pod (warspace-server-0.warspace-server.warspace.svc...)
apiVersion: v1
kind: Service
metadata:
  name: warspace-server
  namespace: warspace
  labels: {app: warspace-server}
spec:
  clusterIP: None
  selector: {app: warspace-server}
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
# Balanceia /api entre todos os shards (qualquer pod agrega a lista de salas)
apiVersion: v1
kind: Service
metadata:
  name: warspace-server-api
  namespace: warspace
  labels: {app: warspace-server}
spec:
  selector: {app: warspace-server}
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
