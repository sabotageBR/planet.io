# Headless: dá DNS estável por pod (warspace-server-0.warspace-server.warspace.svc...)
apiVersion: v1
kind: Service
metadata:
  name: warspace-server
  namespace: warspace
  labels: {app: warspace-server}
spec:
  clusterIP: None
  selector: {app: warspace-server}
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
# Balanceia /api entre todos os shards (qualquer pod agrega a lista de salas)
apiVersion: v1
kind: Service
metadata:
  name: warspace-server-api
  namespace: warspace
  labels: {app: warspace-server}
spec:
  selector: {app: warspace-server}
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: warspace-server-0
  namespace: warspace
  labels: {app: warspace-server, shard: "0"}
spec:
  selector:
    app: warspace-server
    statefulset.kubernetes.io/pod-name: warspace-server-0
  ports: [{name: http, port: 3000, targetPort: 3000}]
---
apiVersion: v1
kind: Service
metadata:
  name: warspace-server-1
  namespace: warspace
  labels: {app: warspace-server, shard: "1"}
spec:
  selector:
    app: warspace-server
    statefulset.kubernetes.io/pod-name: warspace-server-1
  ports: [{name: http, port: 3000, targetPort: 3000}]
---
apiVersion: v1
kind: Service
metadata:
  name: warspace-server-2
  namespace: warspace
  labels: {app: warspace-server, shard: "2"}
spec:
  selector:
    app: warspace-server
    statefulset.kubernetes.io/pod-name: warspace-server-2
  ports: [{name: http, port: 3000, targetPort: 3000}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: warspace-server
  namespace: warspace
  labels: {app: warspace-server}
spec:
  serviceName: warspace-server
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: warspace-server}
  template:
    metadata:
      labels: {app: warspace-server}
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: server
          image: __IMAGE_SERVER__
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 3000}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
          envFrom:
            - configMapRef: {name: warspace-config}
            - secretRef: {name: warspace-db, optional: true}   # sem o Secret o servidor sobe em modo sem persistência
          readinessProbe:
            httpGet: {path: /healthz, port: 3000}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 3000}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits:   {cpu: "1",  memory: 512Mi}
