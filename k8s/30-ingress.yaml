apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: planet
  namespace: planet
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # WebSocket é conexão longa: sem isso o nginx corta em 60s
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  tls:
    - hosts: [__HOST__]
      secretName: tls-planet-ingress
  rules:
    - host: __HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: planet-client
                port: {number: 80}
